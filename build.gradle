plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()

	runs {
		client {
			client()
			// Dev client logs straight into a server when CRAFTGUESSR_QUICKPLAY is set,
			// e.g. docker compose run -e CRAFTGUESSR_QUICKPLAY=dev:25565 client
			def quickplay = System.getenv('CRAFTGUESSR_QUICKPLAY')
			if (quickplay != null && !quickplay.isBlank()) {
				programArgs '--quickPlayMultiplayer', quickplay
			}
			if (System.getenv('CRAFTGUESSR_SOFTWARE_GL') != null) {
				jvmArgs '-Dcraftguessr.softwareGL=1'
			}
		}
	}

	mods {
		"craftguessr" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation platform("org.junit:junit-bom:5.11.4")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

test {
	useJUnitPlatform()
	systemProperty 'java.awt.headless', 'true'
	// Live tests hit the real AI endpoints; opt in with -Pcraftguessr.live=true
	systemProperty 'craftguessr.live', (findProperty('craftguessr.live') ?: 'false').toString()
	systemProperty 'craftguessr.apiKey', (findProperty('craftguessr.apiKey') ?: '').toString()
	systemProperty 'craftguessr.aiBase', (findProperty('craftguessr.aiBase') ?: 'https://api.deepseek.com').toString()
	systemProperty 'craftguessr.aiModel', (findProperty('craftguessr.aiModel') ?: 'deepseek-flash').toString()
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}

// Prints everything needed to launch a run task without Gradle, so the dev
// server and a dev client can run at the same time (they share one Gradle home).
tasks.register('dumpRunServer') {
	dependsOn 'classes', 'processResources'
	def run = tasks.named('runServer')
	doLast {
		def t = run.get()
		println 'MAIN#' + t.mainClass.get()
		println 'WORKDIR#' + t.workingDir
		println 'JVM#' + t.jvmArgs.join('\u0001')
		println 'ARGS#' + t.args.join('\u0001')
		println 'CP#' + t.classpath.asPath
	}
}
